<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Filter Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Include Chart.js -->
    <style>
        #textInputBrowser, #textInputMobile {
            flex: 1;
            margin-right: 10px;
        }

        #sendTextButtonBrowser, #sendTextButtonMobile {
            flex-shrink: 0;
        }

        #loadingIcon {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #loadingIconMobile {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -20%);
        }

        #responseText, #responseTextMobile {
            margin-top: 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            color: black;
            text-align: left;
        }
    
        /* Match text area styling with the main website's variables */
        #textInputBrowser, #textInputMobile {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px; /* Matching $base-font-size */
            line-height: 1.5; /* Matching $base-line-height */
            font-weight: 400; /* Matching $base-font-weight */
            color: #111; /* Matching $text-color */
        }


        /* Target the table with class "dataframe" */
        table.dataframe {
            border-collapse: collapse; /* Merge adjacent borders */
            width: auto; /* Adjust to content width */
            margin: 20px auto; /* Center the table with some margin */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px; /* Set font size */
        }

        /* Style the table headers */
        table.dataframe th {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f4; /* Light gray background */
            text-align: center; /* Center the text */
            padding: 8px; /* Add padding inside cells */
            border: 1px solid #ddd; /* Light gray border */
            font-weight: bold; /* Bold headers */
        }

        /* Style the table rows */
        table.dataframe td {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 8px; /* Add padding inside cells */
            border: 1px solid #ddd; /* Light gray border */
            text-align: center; /* Center the text */
        }


        /* Add alternating row colors for better readability */
        table.dataframe tr:nth-child(even) {
            background-color: #f9f9f9; /* Light gray background */
        }

        /* Add hover effect on rows */
        table.dataframe tr:hover {
            background-color: #f1f1f1; /* Slightly darker background */
        }


        @media screen and (max-width: 600px) and (min-width: 10px) {
            #tab1 {
                display: none;
            }
        }

        @media screen and (min-width: 600px) {
            #tab2 {
                display: none;
            }
        }
    </style>
</head>

<body>

<div style="height:20px;" id="tab1"></div>

<table style="width: 100%; height: 100px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); text-align: center; border-width: 0px; background-color: #fdfdfd;" cellspacing="0" cellpadding="0" style="height:310px;" id="tab1">
    <tr>
        <td style="width:50px;"> </td>
        <td id="textoprincipal" style="font-size:18px">
            <p style="margin-bottom: 30px;"></p>

            <p style="margin-bottom: 0.5cm;font-size:24px;color:black"><b>Haz cualquier pregunta sobre la Maratón de Berlín</b></p>
            <div style="display: flex;">
                <textarea id="textInputBrowser" rows="2" cols="50"></textarea>
                <button type="button" id="sendTextButtonBrowser">Enviar</button>
            </div>

            <p style="margin-bottom: 30px;"></p>

            <div id="loadingIcon" style="display: none;">
                <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWZzNWR3OG5kcGZtd3Z3bDd4ZGIyOW9oNmFsNTh2OHU0MDN1dnJ3dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/YOSZmoAvRUyUaaeRM1/giphy.webp" alt="Loading Icon" width="120">
            </div>

            <!-- Div to display the API response -->
            <div id="responseText"></div>
        </td>
        <td style="width:15px;"> </td>
    </tr>
</table>




<table style="width: 100%; height: 100px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); text-align: center; border-width: 0px; background-color: #fdfdfd;" cellspacing="0" cellpadding="0" style="height:310px;" id="tab2">
    <tr>
        <td style="width:50px;"> </td>
        <td id="textoprincipal" style="font-size:18px">
            <p style="margin-bottom: 30px;"></p>

            <p style="margin-bottom: 0.5cm;font-size:24px;color:black"><b>Haz cualquier pregunta sobre la Maratón de Berlín</b></p>
            <div style="display: flex;">
                <textarea id="textInputMobile" rows="2" cols="28"></textarea>
                <button type="button" id="sendTextButtonMobile">Enviar</button>
            </div>

            <p style="margin-bottom: 30px;"></p>

            <div id="loadingIconMobile" style="display: none;">
                <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWZzNWR3OG5kcGZtd3Z3bDd4ZGIyOW9oNmFsNTh2OHU0MDN1dnJ3dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/YOSZmoAvRUyUaaeRM1/giphy.webp" alt="Loading Icon" width="120">
            </div>

            <p style="margin-bottom: 30px;"></p>

            <!-- Div to display the API response -->
            <div id="responseTextMobile"></div>
            
            <p style="margin-bottom: 50px;"></p>
        </td>
        <td style="width:15px;"> </td>
    </tr>
</table>



<script>
    function setupForm(textInputId, buttonId, loadingId, responseId) {
        $(document).ready(function () {
            var myChart;

            $('#' + buttonId).on('click', function () {
                if (myChart) {
                    myChart.destroy();
                }

                // Clear the previous response and show loading message
                $('#' + responseId).html('<p style="margin-bottom: 100px; color: white; text-align: center">\n Cargando la respuesta... \n</p><p style="margin-bottom: 20px; color: black; text-align: center">\n Esto puede tardar aproximadamente 20 segundos... \n</p>');

                $('#' + loadingId).show();
                var text = $('#' + textInputId).val();

                $.ajax({
                    url: 'https://j38d9y5pud.execute-api.us-east-2.amazonaws.com/prod/prod',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ question: text }),
                    success: function (response) {
                        $('#' + loadingId).hide();

                        try {
                            // Check if the response contains an error message
                            if (response.errorMessage) {
                                if (response.errorType === "ThrottlingException") {
                                    $('#' + responseId).html('<p style="color: black;text-align: center">Hay mucho tráfico. Por favor, envía la pregunta de nuevo.</p><p style="margin-bottom: 20px; color: white">\n C \n</p>');
                                } else if (response.errorType === "InvalidRequestException") {
                                    $('#' + responseId).html('<p style="color: black;text-align: center">Hubo un problema con la pregunta. Por favor, intenta reescribirla y enviarla de nuevo.</p><p style="margin-bottom: 20px; color: white">\n C \n</p>');
                                } else {
                                    $('#' + responseId).html('<p style="color: black;text-align: center">Hubo un problema con la pregunta. Por favor, intenta de nuevo.</p><p style="margin-bottom: 20px; color: white">\n C \n</p>');
                                }
                            } else {
                                // No errors, display the actual response
                                var responseBody = response.body;
                                var formattedText = responseBody.replace(/\n/g, ' ');
                                $('#' + responseId).html(formattedText + '<p style="margin-bottom: 20px; color: white;">\n \Cargando la respuesta \n</p>');
                            }
                        } catch (e) {
                            $('#' + responseId).html('<p style="color: black;text-align: center">Hubo un problema con la pregunta. Por favor, intenta de nuevo.</p><p style="margin-bottom: 20px; color: white">\n C \n</p>');
                            console.error("Error while parsing the response:", e);
                        }
                    },
                    error: function (xhr) {
                        // Handling actual HTTP errors (e.g., network issues)
                        $('#' + loadingId).hide();
                        try {
                            var errorResponse = JSON.parse(xhr.responseText);
                            if (errorResponse.errorType === "ThrottlingException") {
                                $('#' + responseId).html('<p style="color: red;">Too many requests. Please retry after a moment.</p>');
                            } else if (errorResponse.errorType === "InvalidRequestException") {
                                $('#' + responseId).html('<p style="color: red;">Invalid request: Please check your query syntax.</p>');
                            } else {
                                $('#' + responseId).html('<p style="color: red;">Hubo un error en la pregunta. Por favor, vuelve a intentarlo.</p>');
                            }
                        } catch (e) {
                            $('#' + responseId).html('<p style="color: red;">Hubo un error en la pregunta. Por favor, vuelve a intentarlo.</p>');
                            console.error("Error parsing server error response:", e);
                        }
                    }
                });
            });
        });
    }


    setupForm('textInputBrowser', 'sendTextButtonBrowser', 'loadingIcon', 'responseText');
    setupForm('textInputMobile', 'sendTextButtonMobile', 'loadingIconMobile', 'responseTextMobile');

    function setupAutoResize(textInputId) {
        const textarea = document.getElementById(textInputId);

        textarea.addEventListener('input', function () {
            this.style.height = 'auto'; // Reset the height to recalculate
            this.style.height = this.scrollHeight + 'px'; // Set to the new calculated height
        });
    }

    setupAutoResize('textInputBrowser');
    setupAutoResize('textInputMobile');


</script>


</body>
</html>
