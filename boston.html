<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Filter Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Include Chart.js -->
</head>
<body>
    <h1>Filter Form</h1>
    <form id="filterForm">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>
        <label for="year">Year:</label>
        <input type="number" id="year" name="year"><br><br>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select><br><br>
        <label for="country">Country:</label>
        <input type="text" id="country" name="country"><br><br>
        <button type="button" id="sendButton">Send</button>
    </form>
    
    <h2>Send Text</h2>
    <input type="text" id="textInput"><br><br>
    <button type="button" id="sendTextButton">Send Text</button>
    
    <canvas id="myChart" width="400" height="200"></canvas> <!-- Chart.js canvas -->
    
    <!-- Response will be displayed here -->
    <div id="responseText"></div>

    <script>
        var myChart; // Declare a global variable to store the chart instance

        $(document).ready(function() {
            $('#sendButton').on('click', function() {
                // Get filter values
                var age = $('#age').val();
                var year = $('#year').val();
                var gender = $('#gender').val();
                var country = $('#country').val();
                
                // Make AJAX request to API
                $.ajax({
                    url: 'https://l0h7higyqb.execute-api.us-east-2.amazonaws.com/prod',
                    type: 'GET',
                    data: {
                        age: age,
                        year: year,
                        gender: gender,
                        country: country
                    },
                    success: function(response) {
                        // Clear previous chart if it exists
                        if (myChart) {
                            myChart.destroy();
                        }
                        
                        // Plot new chart
                        plotChart(response.body);
                    },
                    error: function(xhr, status, error) {
                        console.error('Error:', error);
                    }
                });
            });
            
            $('#sendTextButton').on('click', function() {
                // Get text input
                var text = $('#textInput').val();
                
                // Make POST request to API
                $.ajax({
                    url: 'https://l0h7higyqb.execute-api.us-east-2.amazonaws.com/prod',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ body: text }),
                    success: function(response) {
                        // Show response on the webpage
                        $('#responseText').html('<p>Response: ' + response.body.content[0].text + '</p>');
                    },
                    error: function(xhr, status, error) {
                        console.error('Error sending text:', error);
                    }
                });
            });
        });

        // Function to plot chart
        function plotChart(data) {
            var labels = Object.keys(data);
            var values = Object.values(data);
            
            var ctx = document.getElementById('myChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Values',
                        data: values,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        yAxes: [{
                            ticks: {
                                beginAtZero: true
                            }
                        }]
                    }
                }
            });
        }
    </script>
</body>
</html>
